name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm lint:copy
      - run: pnpm build
      # Lighthouse (prestaties, toegankelijkheid via axe, best practices, SEO) op de gebouwde site.
      - run: pnpm dlx @lhci/cli@0.15.1 autorun
